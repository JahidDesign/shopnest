<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Shopnest - Online Shopping Bangladesh | Fashion, Electronics & More</title>
    <meta name="title" content="Shopnest - Online Shopping Bangladesh | Fashion, Electronics & More">

    <meta name="author" content="Shopnest Bangladesh">
    <meta name="robots" content="index, follow">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/shop.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.shopnest.com.bd/">
    <meta property="og:title" content="Shopnest - Online Shopping Bangladesh | Fashion, Electronics & More">
    <meta property="og:description" content="Shopnest is your one-stop online shop in Bangladesh for electronics, fashion, beauty products, daily essentials, and smart home items. Enjoy fast delivery and secure payments.">
    <meta property="og:image" content="https://www.shopnest.com.bd/og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">

    <meta property="twitter:image" content="https://www.shopnest.com.bd/og-image.jpg">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.shopnest.com.bd/">

    <!-- Preconnect for Faster Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Example Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- JSON-LD Structured Data -->

    <!-- Store -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "Shopnest",
      "image": "https://www.shopnest.com.bd/logo.png",
      "@id": "https://www.shopnest.com.bd",
      "url": "https://www.shopnest.com.bd",
      "telephone": "+8801234567890",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "123 Shopnest Street",
        "addressLocality": "Dhaka",
        "postalCode": "1207",
        "addressCountry": "BD"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 23.8103,
        "longitude": 90.4125
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
          "opens": "09:00",
          "closes": "21:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Sunday",
          "opens": "10:00",
          "closes": "18:00"
        }
      ],
      "sameAs": [
        "https://www.facebook.com/shopnestbd",
        "https://www.instagram.com/shopnestbd",
        "https://twitter.com/shopnestbd"
      ]
    }
    </script>

    <!-- Website Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Shopnest",
      "url": "https://www.shopnest.com.bd",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.shopnest.com.bd/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Example Products (Repeat for each product dynamically) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Product",
          "name": "Premium Makeup Products",

          },

            "@type": "AggregateRating",

        {

    <!-- CSS / JS -->
    <script type="module" src="/src/main.jsx"></script>
